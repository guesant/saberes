services:
  web:
    image: ${APP_IMAGE:-portal-guesant-saberes-app:local}
    pull_policy: never
    ports:
      - "8000:80"
    restart: unless-stopped

  dev:
    image: ${DEV_IMAGE:-portal-guesant-saberes-dev:local}
    pull_policy: never
    working_dir: /app
    env_file:
      - path: ../../.local/operator/.env
        required: false
    ports:
      - "5173:5173"
    volumes:
      - ../..:/app
      - workspace_modules:/app/node_modules
      - ../../.cache/deno:/deno/cache
    environment:
      DENO_DIR: /deno/cache
      DENO_NO_PROMPT: "1"
      PATH: /opt/mise/shims:/opt/mise/bin:/opt/aqua/bin:/app/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/bin
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
      VITE_CONTENT_DB_URL: ${VITE_CONTENT_DB_URL:-}
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-http://web}
      SOURCE_DB: ${SOURCE_DB:-}
      OUTPUT_DB: ${OUTPUT_DB:-}
      CONTENT_DB: ${CONTENT_DB:-}
    command: bash -c "mise exec -- deno install --frozen --node-modules-dir=auto && mise exec -- deno task dev"

volumes:
  workspace_modules:
