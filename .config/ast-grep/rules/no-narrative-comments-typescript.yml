id: no-narrative-comments-typescript
language: TypeScript
severity: error
message: Comentários narrativos não são permitidos; use documentação versionada ou um comentário de configuração de ferramenta.
rule:
  all:
    - kind: comment
    - not:
        regex: '^//\s*@(?:ts-[a-z-]+|biome-ignore|vite-ignore|vitest-[a-z-]+)\b'
