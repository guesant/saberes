id: no-native-interactive-html-outside-ui
language: Tsx
severity: error
message: Native HTML and SVG are only allowed inside packages/pkg-ui.
files:
  - packages/**/*.tsx
ignores:
  - packages/pkg-ui/**
rule:
  any:
    - pattern: '<button $$$ATTRIBUTES />'
    - pattern: '<button $$$ATTRIBUTES>$$$CHILDREN</button>'
    - pattern: '<a $$$ATTRIBUTES />'
    - pattern: '<a $$$ATTRIBUTES>$$$CHILDREN</a>'
    - pattern: '<article $$$ATTRIBUTES />'
    - pattern: '<article $$$ATTRIBUTES>$$$CHILDREN</article>'
    - pattern: '<aside $$$ATTRIBUTES />'
    - pattern: '<aside $$$ATTRIBUTES>$$$CHILDREN</aside>'
    - pattern: '<blockquote $$$ATTRIBUTES />'
    - pattern: '<blockquote $$$ATTRIBUTES>$$$CHILDREN</blockquote>'
    - pattern: '<code $$$ATTRIBUTES />'
    - pattern: '<code $$$ATTRIBUTES>$$$CHILDREN</code>'
    - pattern: '<div $$$ATTRIBUTES />'
    - pattern: '<div $$$ATTRIBUTES>$$$CHILDREN</div>'
    - pattern: '<em $$$ATTRIBUTES />'
    - pattern: '<em $$$ATTRIBUTES>$$$CHILDREN</em>'
    - pattern: '<figure $$$ATTRIBUTES />'
    - pattern: '<figure $$$ATTRIBUTES>$$$CHILDREN</figure>'
    - pattern: '<figcaption $$$ATTRIBUTES />'
    - pattern: '<figcaption $$$ATTRIBUTES>$$$CHILDREN</figcaption>'
    - pattern: '<footer $$$ATTRIBUTES />'
    - pattern: '<footer $$$ATTRIBUTES>$$$CHILDREN</footer>'
    - pattern: '<form $$$ATTRIBUTES />'
    - pattern: '<form $$$ATTRIBUTES>$$$CHILDREN</form>'
    - pattern: '<h1 $$$ATTRIBUTES />'
    - pattern: '<h1 $$$ATTRIBUTES>$$$CHILDREN</h1>'
    - pattern: '<h2 $$$ATTRIBUTES />'
    - pattern: '<h2 $$$ATTRIBUTES>$$$CHILDREN</h2>'
    - pattern: '<h3 $$$ATTRIBUTES />'
    - pattern: '<h3 $$$ATTRIBUTES>$$$CHILDREN</h3>'
    - pattern: '<h4 $$$ATTRIBUTES />'
    - pattern: '<h4 $$$ATTRIBUTES>$$$CHILDREN</h4>'
    - pattern: '<h5 $$$ATTRIBUTES />'
    - pattern: '<h5 $$$ATTRIBUTES>$$$CHILDREN</h5>'
    - pattern: '<h6 $$$ATTRIBUTES />'
    - pattern: '<h6 $$$ATTRIBUTES>$$$CHILDREN</h6>'
    - pattern: '<input $$$ATTRIBUTES />'
    - pattern: '<select $$$ATTRIBUTES>$$$CHILDREN</select>'
