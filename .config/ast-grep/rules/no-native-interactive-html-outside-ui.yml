    - pattern: '<nav $$$ATTRIBUTES />'
    - pattern: '<nav $$$ATTRIBUTES>$$$CHILDREN</nav>'
    - pattern: '<ol $$$ATTRIBUTES />'
    - pattern: '<ol $$$ATTRIBUTES>$$$CHILDREN</ol>'
    - pattern: '<p $$$ATTRIBUTES />'
    - pattern: '<p $$$ATTRIBUTES>$$$CHILDREN</p>'
    - pattern: '<pre $$$ATTRIBUTES />'
