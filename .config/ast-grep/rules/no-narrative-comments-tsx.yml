id: no-narrative-comments-tsx
language: Tsx
severity: error
message: >-
  Comentários narrativos não são permitidos; use documentação versionada ou um
  comentário de configuração de ferramenta.
rule:
  all:
    - kind: comment
    - not:
        regex: '^//\s*(?:@(?:ts-[a-z-]+|vite-ignore|vitest-[a-z-]+)\b|awkward-type-ignore:\s+\S)'
