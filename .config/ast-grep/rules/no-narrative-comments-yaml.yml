id: no-narrative-comments-yaml
language: Yaml
severity: error
message: >-
  Comentários narrativos não são permitidos; use documentação versionada ou um
  comentário de configuração de ferramenta.
rule:
  all:
    - kind: comment
    - not:
        regex: '^#\s*(?:renovate:|yamllint(?:[:\s]|$)|cspell:|actionlint:)'
