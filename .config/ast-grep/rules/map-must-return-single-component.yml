id: map-must-return-single-component
language: Tsx
severity: error
message: A rendered map callback must return one imported component.
files:
  - packages/**/*.tsx
rule:
  any:
    - pattern: '$COLLECTION.map(($$$PARAMS) => <>$$$CHILDREN</>)'
    - pattern: '$COLLECTION.map(($$$PARAMS) => (<>$$$CHILDREN</>))'
