name: Lint Actions

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QUALITY_CI_IMAGE: portal-guesant-saberes-quality-ci:${{ github.sha }}
  CACHE_FROM: type=gha,scope=portal-guesant-saberes-lint-actions
  CACHE_TO: type=gha,mode=max,scope=portal-guesant-saberes-lint-actions

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd7e4

      - name: Construir toolchain pelo Docker
        run: docker buildx bake --file .container/docker-bake.hcl --load quality-ci

      - name: Validar workflows dentro do Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            "$QUALITY_CI_IMAGE" \
            bash -c '
              yamllint -c .config/.yamllint.yml .github .config/.yamllint.yml
              hadolint --config .config/.hadolint.yaml .container/Dockerfile
              for workflow in .github/workflows/*.yml; do
                actionlint -color "$workflow"
              done
              zizmor .github/workflows
            '
