name: Heavy checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavy-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  QUALITY_CI_IMAGE: portal-guesant-saberes-quality-ci:${{ github.sha }}
  PLAYWRIGHT_IMAGE: portal-guesant-saberes-playwright:${{ github.sha }}
  APP_IMAGE: portal-guesant-saberes-app:${{ github.sha }}
  CACHE_FROM: type=gha,scope=portal-guesant-saberes-heavy-${{ github.ref_name }}
  CACHE_TO: type=gha,mode=max,scope=portal-guesant-saberes-heavy-${{ github.ref_name }}

jobs:
  heavy-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Construir toolchain, runtime e Playwright pelo Docker
        run: docker buildx bake --file .config/container/docker-bake.hcl --load quality-ci runtime playwright

      - name: Executar auditoria completa dentro do Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/.cache/deno:/deno/cache" \
            -w /workspace \
            "$QUALITY_CI_IMAGE" \
            bash -c '
              mise exec -- deno install --frozen --node-modules-dir=auto
              mise exec -- deno task heavy-checks
              mise exec -- deno task build:check
              mise exec -- deno task security:check
            '

      - name: Executar scanners de segurança dentro do Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v portal-guesant-saberes-trivy-cache:/root/.cache/trivy \
            -w /repo \
            "$QUALITY_CI_IMAGE" \
            bash -c '
              aqua exec -- gitleaks dir --no-banner --redact --config /repo/.config/.gitleaks.toml /repo
              aqua exec -- osv-scanner scan source --recursive /repo
              aqua exec -- trivy fs --config /repo/.config/trivy.yaml --ignorefile="" --secret-config="" /repo
              semgrep scan --config auto --error --exclude node_modules --exclude dist /repo/packages
            '

      - name: Gerar e validar SBOM da imagem dentro do Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            -e SBOM_IMAGE="$APP_IMAGE" \
            "$QUALITY_CI_IMAGE" \
            bash -c '
              mise exec -- deno run --allow-read --allow-write --allow-env --allow-run=syft packages/pkg-tooling/src/tools/generate-sbom.tool.ts image
              trivy sbom --config .config/trivy.yaml --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .cache/sbom/image.cdx.json
            '

      - name: Executar E2E e acessibilidade dentro do Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/.cache/deno:/deno/cache" \
            -w /workspace \
            -e PLAYWRIGHT_EXECUTABLE_PATH=/usr/bin/chromium \
            "$PLAYWRIGHT_IMAGE" \
            bash -c '
              mise exec -- deno task build
              mise exec -- python -m http.server 8080 --directory dist >/tmp/saberes-e2e-server.log 2>&1 &
              server_pid=$!
              trap "kill ${server_pid} >/dev/null 2>&1 || true" EXIT
              mise exec -- deno install --frozen --node-modules-dir=auto
              for attempt in $(seq 1 30); do
                curl -fsS http://127.0.0.1:8080/ >/dev/null && break
                sleep 1
              done
              curl -fsS http://127.0.0.1:8080/ >/dev/null
              mise exec -- deno task e2e
              mise exec -- deno task e2e -- packages/app/tests/e2e/accessibility.spec.ts
            '

      - name: Gerar relatórios pesados dentro do Docker
        if: always()
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/.cache/deno:/deno/cache" \
            -w /workspace \
            "$QUALITY_CI_IMAGE" \
            bash -c '
              mise exec -- deno task build
              mise exec -- python -m http.server 8080 --directory dist >/tmp/saberes-reports-server.log 2>&1 &
              server_pid=$!
              trap "kill ${server_pid} >/dev/null 2>&1 || true" EXIT
              mise exec -- deno install --frozen --node-modules-dir=auto
              for attempt in $(seq 1 30); do
                curl -fsS http://127.0.0.1:8080/ >/dev/null && break
                sleep 1
              done
              curl -fsS http://127.0.0.1:8080/ >/dev/null
              set +e
              mise exec -- deno task lighthouse
              lighthouse_status=$?
              mise exec -- deno task quality:report
              qlty_status=$?
              set -e
              mkdir -p .cache
              lizard -l typescript -C 5 -L 35 -a 3 packages | tee .cache/lizard.txt
              echo "Qlty report status: ${qlty_status}"
              exit "$lighthouse_status"
            '

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: lighthouse-report
          path: .cache/lighthouse
          if-no-files-found: ignore

      - name: Upload complexity report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: typescript-complexity-report
          path: .cache/lizard.txt
          if-no-files-found: ignore

      - name: Upload Qlty report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: qlty-report
          path: .cache/qlty-report.sarif
          if-no-files-found: ignore

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sbom
          path: .cache/sbom
          if-no-files-found: ignore
