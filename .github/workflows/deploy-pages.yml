name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_IMAGE: portal-guesant-saberes-pages:${{ github.sha }}
      VITE_BASE_PATH: /
      CACHE_FROM: type=gha,scope=portal-guesant-saberes-pages
      CACHE_TO: type=gha,mode=max,scope=portal-guesant-saberes-pages
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build pelo Docker
        run: docker buildx bake --file .container/docker-bake.hcl --load runtime

      - name: Extrair artefato estático da imagem
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$APP_IMAGE" \
            sh -c '
              mkdir -p /workspace/dist
              cp -a /usr/share/nginx/html/. /workspace/dist/
              cp /workspace/dist/index.html /workspace/dist/404.html
            '

      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
